<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Barcode Print Generator</title>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <text
      x="380"
      y="90"
      text-anchor="middle"
      fill="#ffffff"
      stroke="#0a0a0a"
