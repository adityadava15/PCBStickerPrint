      paint-order="stroke fill"
      font-family="Arial Black, Impact, sans-serif"
      font-size="96"
      font-weight="900"
      letter-spacing="-2"
    >Barcode Print</text>
    <line
      x1="118"
      y1="126"
      x2="642"
      y2="126"
      stroke="#ffffff"
      stroke-width="5"
      stroke-linecap="round"
      opacity="0.9"
    />
    <text
      x="380"
      y="194"
      text-anchor="middle"
      fill="#ffffff"
      stroke="#0a0a0a"
      stroke-width="2.5"
      paint-order="stroke fill"
      font-family="Arial Black, Impact, sans-serif"
      font-size="54"
      font-weight="900"
      letter-spacing="10"
    >GENERATOR</text>
  </g>
